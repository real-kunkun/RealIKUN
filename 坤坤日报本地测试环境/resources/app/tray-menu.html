<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>坤坤日报</title>
<style>
/* 托盘右键菜单：自绘小窗口，跟主界面一套手帐语言（墨黑粗边 + 纸色 + 硬投影）。
   窗口本体 transparent，阴影靠 CSS 画，所以 body 必须留出阴影空间。 */
:root{
  --ink:#17161F;--paper:#FCF8EE;--cream:#F4ECD7;--court:#E8552D;
  --danger:#D8392B;--mist:#D8CDB8;--soft:#8a7f6c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body{
  font-family:'Noto Sans SC','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
  padding:7px 10px 12px 8px;               /* 上 / 右(留阴影) / 下(留阴影) / 左 */
  -webkit-font-smoothing:antialiased;
}
.menu{
  /* 宽高都按内容来：main.js 的 TRAY_MENU 尺寸与这里对齐，卡片不会被视口拉高留白 */
  width:172px;height:auto;
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:13px;
  box-shadow:4px 4px 0 var(--ink);
  display:flex;flex-direction:column;
  padding:0 5px 5px;
  overflow:hidden;
  animation:pop .12s ease-out both;
}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}

/* 顶部品牌条：跟右栏卡片标题栏同款 */
.brand{
  flex:0 0 auto;margin:0 -5px 5px;padding:5px 9px;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:600;letter-spacing:1px;
}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--court);display:block}

.mi{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  height:34px;padding:0 8px;
  border:none;background:none;border-radius:8px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
  cursor:default;text-align:left;
  transition:background .12s,color .12s;
}
.mi .ic{flex:0 0 19px;width:19px;height:19px;display:block;line-height:0;color:currentColor}
.mi .ic svg{width:100%;height:100%;display:block;overflow:visible}
.mi .ic-emoji{display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  font-size:17px;line-height:1}
.mi:hover{background:var(--ink);color:#fff}
.mi:active{transform:translateY(1px)}
.mi.danger:hover{background:var(--danger);color:#fff}

.sep{flex:0 0 auto;height:0;border-top:2px dashed var(--mist);margin:2px 6px}
</style>
</head>
<body>
<div class="menu">
  <div class="brand"><i></i>坤坤日报</div>

  <button class="mi" type="button" data-a="show">
    <span class="ic ic-emoji" aria-hidden="true">🏀</span>打开练习室
  </button>

  <div class="sep"></div>

  <button class="mi danger" type="button" data-a="quit">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M10 3.2H5a1.8 1.8 0 0 0-1.8 1.8v14a1.8 1.8 0 0 0 1.8 1.8h5"
            stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M14.6 8.1 18.5 12l-3.9 3.9" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.2 12H9.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg></span>退出
  </button>
</div>

<script>
document.querySelectorAll('.mi').forEach(function (b) {
  b.addEventListener('click', function () {
    if (window.trayMenu) window.trayMenu.pick(b.dataset.a);
  });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && window.trayMenu) window.trayMenu.close();
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
</body>
</html>
